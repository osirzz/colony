<style>
  :root{
    --bg:#f9f9f7; --surface:#fcfcfb; --surface-alt:#f2f1ec;
    --text:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --border: rgba(11,11,11,0.10); --grid:#e1e0d9;
    --brand:#0f766e; --brand-strong:#0b5c56; --brand-tint: rgba(15,118,110,0.10);
    --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
    --good-tint: rgba(12,163,12,0.12); --warning-tint: rgba(250,178,25,0.18); --critical-tint: rgba(208,59,59,0.12);
    --chart-series:#2a78d6; --chart-series-tint: rgba(42,120,214,0.12);
    --radius:16px; --radius-sm:10px;
    --shadow: 0 1px 2px rgba(11,11,11,0.06), 0 6px 16px rgba(11,11,11,0.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      --bg:#0d0d0d; --surface:#1a1a19; --surface-alt:#222220;
      --text:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d86;
      --border: rgba(255,255,255,0.12); --grid:#2c2c2a;
      --brand:#2dd4bf; --brand-strong:#5eead4; --brand-tint: rgba(45,212,191,0.16);
      --good:#0ca30c; --warning:#fab219; --critical:#e66767;
      --good-tint: rgba(12,163,12,0.20); --warning-tint: rgba(250,178,25,0.22); --critical-tint: rgba(230,103,103,0.20);
      --chart-series:#3987e5; --chart-series-tint: rgba(57,135,229,0.18);
      --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0d0d; --surface:#1a1a19; --surface-alt:#222220;
    --text:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d86;
    --border: rgba(255,255,255,0.12); --grid:#2c2c2a;
    --brand:#2dd4bf; --brand-strong:#5eead4; --brand-tint: rgba(45,212,191,0.16);
    --good:#0ca30c; --warning:#fab219; --critical:#e66767;
    --good-tint: rgba(12,163,12,0.20); --warning-tint: rgba(250,178,25,0.22); --critical-tint: rgba(230,103,103,0.20);
    --chart-series:#3987e5; --chart-series-tint: rgba(57,135,229,0.18);
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    overscroll-behavior-y:none;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  a{color:inherit;}
  button{font-family:inherit;}
 
  .topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    padding:14px 18px 12px;
    border-bottom:1px solid var(--border);
  }
  .topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .topbar .sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .topbar-actions{display:flex;gap:8px;flex:none;}
  .lang-switch{
    flex:none;background:var(--surface-alt);border:1px solid var(--border);color:var(--text-secondary);
    border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .theme-switch{
    flex:none;background:var(--surface-alt);border:1px solid var(--border);color:var(--text-secondary);
    border-radius:999px;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;cursor:pointer;
  }
 
  main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom));}
 
  svg{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle;}
  .btn svg{width:18px;height:18px;}
  .quick-btn .ic svg{width:20px;height:20px;}
  .banner > svg{width:26px;height:26px;flex:none;}
 
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:12px;
  }
  .card h2{font-size:15px;margin:0 0 10px;font-weight:700;}
  .muted{color:var(--text-muted);}
  .secondary{color:var(--text-secondary);}
  .small{font-size:12.5px;}
 
  .banner{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--brand-tint);
    border-radius:var(--radius);
    padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--text-secondary);
  }
  .banner strong{color:var(--text);}
  .banner button.dismiss{
    margin-inline-start:auto;background:none;border:none;color:var(--text-muted);
    font-size:16px;line-height:1;cursor:pointer;padding:2px 4px;
  }
 
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .quick-btn{
    display:flex;flex-direction:column;gap:6px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;cursor:pointer;text-align:start;box-shadow:var(--shadow);
    color:var(--text);
  }
  .quick-btn .ic{color:var(--brand);}
  .quick-btn b{font-size:13.5px;}
  .quick-btn span{font-size:11.5px;color:var(--text-muted);}
 
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 10px;text-align:center;}
  .stat-tile .val{font-size:22px;font-weight:700;}
  .stat-tile .lbl{font-size:11px;color:var(--text-muted);margin-top:2px;}
 
  .stat-strip{display:flex;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 4px;margin-bottom:12px;}
  .stat-seg{flex:1;text-align:center;padding:0 6px;}
  .stat-seg + .stat-seg{border-inline-start:1px solid var(--border);}
  .stat-seg .ic{display:flex;align-items:center;justify-content:center;margin:0 auto 4px;}
  .stat-seg .ic svg{width:18px;height:18px;}
  .stat-seg .val{font-size:20px;font-weight:700;}
  .stat-seg .lbl{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
 
  input, select, textarea{
    width:100%;font-family:inherit;font-size:14.5px;color:var(--text);
    background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--brand);}
  label.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin:12px 0 6px;}
  label.field-label:first-child{margin-top:0;}
 
  .food-chip-input{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    width:100%;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:7px 8px;
  }
  .food-chip-input:focus-within{border-color:var(--brand);}
  .food-chip{
    display:inline-flex;align-items:center;gap:3px;
    background:var(--brand-tint);color:var(--brand);
    border-radius:999px;padding-block:4px;padding-inline:10px 6px;font-size:12.5px;font-weight:600;line-height:1.2;
  }
  .food-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:2px;flex:none;}
  .food-chip-input input{
    flex:1;min-width:90px;width:auto;border:none;background:transparent;padding:4px 2px;
  }
  .food-chip-input input:focus{border:none;}
 
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--brand); color:#fff; border:none;border-radius:var(--radius-sm);
    padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn:active{background:var(--brand-strong);}
  .btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--border);}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 11px;font-size:12.5px;}
  .btn.danger{background:var(--critical);}
  .link-btn{background:none;border:none;color:var(--brand);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0;}
 
  .search-row{display:flex;gap:8px;margin-bottom:10px;}
  .search-row input{flex:1;}
 
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .chip{
    border:1px solid var(--border); background:var(--surface-alt); color:var(--text-secondary);
    border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}
 
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:2px 0;font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--text-secondary);
  }
  .badge .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .badge.low .dot{background:var(--good);}
  .badge.mod .dot{background:var(--warning);}
  .badge.high .dot{background:var(--critical);}
 
  .food-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 4px;border-bottom:1px solid var(--border);
  }
  .food-item:last-child{border-bottom:none;}
  .food-item .name{font-size:14px;font-weight:600;}
  .food-item .serv{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .f-ic{font-size:19px;flex:none;width:24px;text-align:center;line-height:1;}
  .f-body{flex:1;min-width:0;}
  .cat-heading{
    display:flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
    color:var(--text-muted);margin:18px 0 4px;padding:0 4px;
  }
  .cat-heading:first-child{margin-top:2px;}
 
  .trigger-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;}
  .trigger-card .ic{font-size:20px;flex:none;line-height:1;}
  .trigger-card .sev-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .trigger-card .body{flex:1;min-width:0;}
  .trigger-card .name{font-size:14px;font-weight:600;}
  .trigger-card .meta{font-size:11.5px;color:var(--text-muted);}
  .trigger-card .rm{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px 6px;}
  .auto-tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--brand);background:var(--brand-tint);border-radius:999px;padding:1px 6px;margin-inline-start:4px;vertical-align:middle;}
 
  .sev-select{display:flex;gap:6px;}
  .sev-opt{
    flex:1;text-align:center;padding:9px 4px;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--surface-alt);font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;
  }
  .sev-opt.on{background:var(--warning-tint);border-color:var(--warning);color:var(--text);}
 
  .symptom-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .symptom-row .lbl{font-size:13.5px;font-weight:600;}
  .sev-scale{display:flex;gap:5px;}
  .sev-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface-alt);font-size:12px;font-weight:700;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .sev-btn.on0.on{background:var(--surface-alt);border-color:var(--text-muted);}
  .sev-btn.on1.on{background:var(--good-tint);border-color:var(--good);}
  .sev-btn.on2.on{background:var(--warning-tint);border-color:var(--warning);}
  .sev-btn.on3.on{background:var(--critical-tint);border-color:var(--critical);}
 
  .entry-card{border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;}
  .entry-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .entry-card .time{font-size:11.5px;color:var(--text-muted);font-weight:600;}
  .entry-card .foods{font-size:14px;font-weight:600;margin:4px 0 6px;unicode-bidi:plaintext;}
  .entry-card .serv, .entry-card .notes{unicode-bidi:plaintext;}
  .entry-card .sym-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .sym-chip{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface-alt);color:var(--text-secondary);}
  .sym-chip.hi{background:var(--critical-tint);color:var(--text);}
  .entry-card .notes{font-size:12.5px;color:var(--text-secondary);margin-top:4px;}
  .entry-card .del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;padding:4px;}
  .date-group-lbl{font-size:12px;font-weight:700;color:var(--text-muted);margin:16px 0 8px;padding:0 2px;}
  .date-group-lbl:first-child{margin-top:2px;}
 
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state svg{width:40px;height:40px;margin-bottom:10px;color:var(--text-muted);}
  .empty-state p{font-size:13.5px;margin:4px 0 14px;}
  .empty-inline{text-align:center;padding:22px 10px;color:var(--text-muted);font-size:13px;}
  .empty-inline .nudge-title{font-weight:700;color:var(--text);font-size:14px;margin-bottom:4px;}
  .empty-inline .nudge-sub{color:var(--text-muted);font-size:12.5px;}
 
  /* Today at a glance */
  .today-glance{
    display:flex;align-items:center;flex-wrap:wrap;gap:6px;
    font-size:12.5px;color:var(--text-secondary);font-weight:600;
    margin:0 2px 12px;
  }
  .today-glance .tg-sep{color:var(--text-muted);font-weight:400;}
  .today-glance .tg-flare{color:var(--critical);}
  .today-glance .tg-streak{color:var(--brand);}
 
  /* Weekly shape strip */
  .week-shape{display:flex;gap:5px;margin:2px 2px 16px;}
  .week-shape-seg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .week-shape-seg .wd{font-size:9.5px;color:var(--text-muted);font-weight:700;}
  .week-shape-seg .bar{width:100%;height:8px;border-radius:4px;background:var(--border);}
  .week-shape-seg.ok .bar{background:var(--good);}
  .week-shape-seg.flare .bar{background:var(--critical);}
 
  /* Floating log button */
  .fab-wrap{
    position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom) + 12px);
    max-width:480px;margin:0 auto;z-index:25;pointer-events:none;
    display:flex;justify-content:flex-end;padding-inline-end:18px;
  }
  .fab{
    pointer-events:auto;width:52px;height:52px;border-radius:50%;flex:none;
    background:var(--brand);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(11,11,11,0.28);cursor:pointer;
  }
  .fab svg{width:24px;height:24px;}
 
  /* Date scroller */
  .date-scroll-wrap{margin-bottom:12px;}
  .date-scroll-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 2px;}
  .date-scroll-head .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);}
  .date-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .date-pill{
    scroll-snap-align:center;flex:none;width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 3px 7px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;
  }
  .date-pill .dow{font-size:10px;color:var(--text-muted);text-transform:uppercase;font-weight:700;}
  .date-pill .dom{font-size:15px;font-weight:700;}
  .date-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--chart-series);margin-top:2px;}
  .date-pill .dot.flare{background:var(--critical);}
  .date-pill .dot.none{background:transparent;}
  .date-pill.selected{background:var(--brand);border-color:var(--brand);}
  .date-pill.selected .dow,.date-pill.selected .dom{color:#fff;}
  .date-pill.selected .dot{background:#fff;}
  .date-pill.selected .dot.none{background:transparent;}
  .date-pill.is-today:not(.selected){border-color:var(--brand);}
  .date-pill.is-today:not(.selected) .dow{color:var(--brand);font-weight:800;}
  .week-pill{width:auto;padding:9px 13px 8px;}
  .week-pill .dow{font-size:11px;white-space:nowrap;}
  .day-panel-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px;gap:4px;}
  .day-panel-head h3{font-size:14.5px;margin:0;font-weight:700;flex:1;text-align:center;}
  .day-nav-btn{background:none;border:none;padding:6px;margin:0;cursor:pointer;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;}
  .day-nav-btn svg{width:18px;height:18px;}
  .day-nav-btn.prev svg{transform:rotate(180deg);}
  [dir="rtl"] .day-nav-btn.prev svg{transform:rotate(0deg);}
  [dir="rtl"] .day-nav-btn.next svg{transform:rotate(180deg);}
  .day-nav-btn:disabled{opacity:.25;cursor:default;}
 
  /* Chart */
  .chart-wrap{position:relative;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative;}
  .bar-row .blabel{width:96px;flex:none;font-size:12px;color:var(--text-secondary);text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;position:relative;height:24px;}
  .bar-fill{
    position:absolute;inset-inline-start:0;top:0;height:24px;max-height:24px;
    background:var(--chart-series); border-radius:4px; min-width:4px;
    display:flex;align-items:center;
  }
  .bar-fill .tip-val{position:absolute;inset-inline-end:-26px;font-size:12px;font-weight:700;color:var(--text);}
  .bar-fill:focus-visible, .bar-fill:hover{outline:2px solid var(--chart-series);outline-offset:2px;}
  .chart-tooltip{
    position:absolute;background:var(--text);color:var(--bg);font-size:11.5px;
    padding:6px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;
    transform:translate(-50%,-130%);z-index:5;box-shadow:var(--shadow);
  }
  [dir="rtl"] .chart-tooltip{ transform:translate(50%,-130%); }
  .chart-tooltip b{font-weight:700;}
 
  /* Tab bar */
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    max-width:480px;margin:0 auto;
    display:flex;justify-content:space-around;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--text-muted);font-size:10.5px;font-weight:600;padding:4px 8px;cursor:pointer;flex:1;
  }
  .tab-btn svg{width:22px;height:22px;}
  .tab-btn.active{color:var(--brand);}
 
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{
    background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
    display:flex;flex-direction:column;
  }
  .modal-sheet h2{margin:0 0 4px;font-size:17px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .modal-head button{background:none;border:none;color:var(--text-muted);font-size:22px;line-height:1;cursor:pointer;}
  .fodmap-list{overflow-y:auto;flex:1;}
  .fodmap-list-inline{max-height:420px;overflow-y:auto;}
  .fodmap-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border);}
  .fodmap-row .info{flex:1;min-width:0;}
  .fodmap-row .info .name{font-size:13px;font-weight:600;}
  .fodmap-row .info .lvl{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .fodmap-row .info .lvl .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .fodmap-row .info .lvl-low .dot{background:var(--good);}
  .fodmap-row .info .lvl-mod .dot{background:var(--warning);}
  .fodmap-row .info .lvl-high .dot{background:var(--critical);}
 
  .fm-tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
  .fm-tile{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px 6px 9px;text-align:center;cursor:pointer;min-height:86px;color:var(--text);
  }
  .fm-tile.added{background:var(--brand-tint);border-color:var(--brand);}
  .fm-tile-ic{font-size:20px;line-height:1;}
  .fm-tile-name{font-size:10.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .fm-tile-lvl{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:.01em;}
  .fm-tile-lvl .fm-tile-dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .fm-tile.lvl-low .fm-tile-lvl{color:var(--good);}
  .fm-tile.lvl-mod .fm-tile-lvl{color:var(--warning-text,var(--warning));}
  .fm-tile.lvl-high .fm-tile-lvl{color:var(--critical);}
  .fm-tile.lvl-low .fm-tile-dot{background:var(--good);}
  .fm-tile.lvl-mod .fm-tile-dot{background:var(--warning);}
  .fm-tile.lvl-high .fm-tile-dot{background:var(--critical);}
  .fm-tile-check{position:absolute;top:4px;inset-inline-end:4px;color:var(--brand);}
  .fm-tile-check svg{width:13px;height:13px;}
  .fm-more-hint{font-size:11px;color:var(--text-muted);text-align:center;padding:2px 0 10px;}
 
  .trigger-tile .tile-date{font-size:8px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
 
  .welcome-sheet{padding-top:26px;}
  .welcome-icon{font-size:50px;text-align:center;line-height:1;margin-bottom:8px;}
  .welcome-title{text-align:center;margin:0 0 4px;font-size:19px;}
  .welcome-sub{text-align:center;color:var(--text-secondary);font-size:13px;margin:0 0 16px;line-height:1.45;}
  .welcome-fodmap-box{background:var(--brand-tint);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;}
  .welcome-fodmap-box .wf-head{font-weight:700;font-size:13.5px;margin-bottom:4px;}
  .welcome-fodmap-box p{margin:0;font-size:12.5px;color:var(--text-secondary);line-height:1.55;}
  .welcome-steps{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
  .w-step{display:flex;gap:11px;align-items:flex-start;}
  .w-step .w-ic{font-size:21px;line-height:1.3;flex:none;}
  .w-step b{font-size:13px;}
  .w-step .w-desc{font-size:11.5px;color:var(--text-secondary);margin-top:1px;line-height:1.4;}
 
  .trigger-tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
  .trigger-tile{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    background:var(--surface);box-shadow:var(--shadow);border-radius:var(--radius-sm);
    padding:16px 6px 10px;text-align:center;cursor:pointer;min-height:96px;
  }
  .trigger-tile .ic{font-size:20px;line-height:1;}
  .trigger-tile .name{font-size:11px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .trigger-tile .sev-lbl{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:.01em;}

    .btn, .chip, .quick-btn, .date-pill, .add-btn, .tab-btn, .sev-opt, .sev-btn,
    .theme-switch, .lang-switch, .fm-cat-head, .stat-tile, .fm-tile, .trigger-tile, .trigger-card, .entry-card, .fab, .day-nav-btn{

    }

    .fm-cat-body{ animation: viewIn .2s ease both; }
    .chevron{ transition: transform .2s ease; }
  }

let toastTimer;
function toast(msg, undoFn){
  const el = document.getElementById("toast");
  el.innerHTML = '<span>'+esc(msg)+'</span>' + (undoFn ? '<button id="toast-undo" class="toast-undo">'+esc(t("undo"))+'</button>' : '');
  el.classList.add("show");
  clearTimeout(toastTimer);
  if (undoFn){
    document.getElementById("toast-undo").addEventListener("click", ()=>{
      clearTimeout(toastTimer);
      el.classList.remove("show");
      undoFn();
    });
  }
  toastTimer = setTimeout(()=> el.classList.remove("show"), undoFn ? 3000 : 1800);
}

function isIOS(){
  return /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isStandalone(){
  return window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
}
 
function renderHome(resetScroll){
  if (resetScroll){
    dateScrollPos = null;
  } else {
    const oldStrip = document.getElementById("date-scroll");
    if (oldStrip) dateScrollPos = oldStrip.scrollLeft;
  }
 
  let html = "";
 
  if (isIOS() && !isStandalone() && !loadJSON(STORE_HINT,false)) {
    html += '<div class="banner" id="install-hint">'
      + svg("home") +
      '<div><strong>'+t("install_title")+'</strong> '+t("install_body")+'</div>'
      + '<button class="dismiss" id="dismiss-hint" aria-label="Dismiss">×</button>'
    + '</div>';
  }
 
  const hasHistory = !(state.diary.length===0 && state.triggers.length===0);
  if (!hasHistory){
    html += '<div class="banner">'+svg("target")+'<div><strong>'+t("get_started")+'</strong> '+t("get_started_body")+'</div></div>';
  } else {
    html += todayGlanceHtml();
  }
 
  html += '<button class="btn block" id="open-add-entry" style="margin-bottom:12px;">'+svg("plus")+' '+t("btn_log_entry")+'</button>';
 
  const lastEntry = getLastEntry();
  if (lastEntry){
    html += '<button class="btn ghost block" id="repeat-last" style="margin-bottom:12px;">'+svg("repeat")+' '+t("btn_repeat_last")+'</button>';

    + '</div>'
    + '<button class="link-btn" id="jump-today">'+t("today")+'</button>'
    + '</div>';
 
  html += renderDateStrip();
 
  if (state.trackerMode === "day"){
    const entries = state.diary.filter(e=>e.date===state.selectedDate).sort((a,b)=> (a.time||"").localeCompare(b.time||""));
    const isTodaySel = state.selectedDate === todayISO();
    html += '<div class="day-panel-head">'
      + '<button class="day-nav-btn prev" id="day-prev" aria-label="'+esc(t("prev_day"))+'">'+svg("chevron")+'</button>'
      + '<h3>'+esc(formatDate(state.selectedDate))+'</h3>'
      + '<button class="day-nav-btn next" id="day-next" aria-label="'+esc(t("next_day"))+'"'+(isTodaySel?' disabled':'')+'>'+svg("chevron")+'</button>'
      + '</div>';
    html += '<div id="entries-panel">';
    if (!entries.length){
      if (state.selectedDate === todayISO()){
        html += '<div class="empty-inline">'
          + '<div class="nudge-title">'+t("today_nudge_title")+'</div>'
          + '<div class="nudge-sub">'+t("today_nudge_sub")+'</div>'
          + '<button class="btn sm" id="nudge-log-now" style="margin-top:10px;">'+t("today_nudge_cta")+'</button>'
          + '</div>';
      } else {
        html += '<div class="empty-inline">'+t("day_empty")+'</div>';
      }
    } else if (entries.length === 1){
      html += entryCardHtml(entries[0]);
    } else {
      const mealGroups = {};
      entries.forEach(e=>{ const m = e.meal || "Snack"; (mealGroups[m]=mealGroups[m]||[]).push(e); });
      MEALS.forEach(m=>{
        if (!mealGroups[m]) return;
        html += '<div class="date-group-lbl">'+esc(mealLabel(m))+'</div>' + mealGroups[m].map(entryCardHtml).join("");
      });
      Object.keys(mealGroups).forEach(m=>{
        if (MEALS.includes(m)) return;
        html += '<div class="date-group-lbl">'+esc(mealLabel(m))+'</div>' + mealGroups[m].map(entryCardHtml).join("");
      });
    }
    html += '</div>';
  } else {
    const start = state.selectedWeek, end = weekEndISO(start);
    const weekEntries = state.diary.filter(e=> e.date>=start && e.date<=end);
    const isCurWeek = start === buildWeekList(1)[0];
    html += '<div class="day-panel-head">'
      + '<button class="day-nav-btn prev" id="day-prev" aria-label="'+esc(t("prev_week"))+'">'+svg("chevron")+'</button>'
      + '<h3>'+esc(weekLabel(start))+'</h3>'
      + '<button class="day-nav-btn next" id="day-next" aria-label="'+esc(t("next_week"))+'"'+(isCurWeek?' disabled':'')+'>'+svg("chevron")+'</button>'
      + '</div>';
    html += '<div id="entries-panel">';
    html += weekShapeStripHtml(start);
    if (!weekEntries.length){
      html += '<div class="empty-inline">'+t("day_empty")+'</div>';
    } else {
      const groups = {};
      [...weekEntries].sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time)).forEach(e=> (groups[e.date]=groups[e.date]||[]).push(e));
      Object.keys(groups).sort().reverse().forEach(d=>{
        html += '<div class="date-group-lbl">'+esc(formatDate(d))+'</div>';
        groups[d].forEach(e=> html += entryCardHtml(e));
      });
    }
    html += '</div>';
  }
 
  html += '<button class="link-btn" id="open-disclaimer" style="display:block;margin:18px auto 4px;">ℹ️ '+t("disclaimer_link")+'</button>';
 
  mountView(html);
 
  const hintBtn = document.getElementById("dismiss-hint");
  if (hintBtn) hintBtn.addEventListener("click", ()=>{
    saveJSON(STORE_HINT, true);
    document.getElementById("install-hint").remove();
  });
  document.getElementById("open-add-entry").addEventListener("click", ()=> openEntryModal());
  document.getElementById("open-disclaimer").addEventListener("click", openDisclaimerModal);
  document.getElementById("jump-today").addEventListener("click", ()=>{
    state.trackerMode = "day";
    state.selectedDate = todayISO();
    renderHome(true);
  });
  const nudgeBtn = document.getElementById("nudge-log-now");
  if (nudgeBtn) nudgeBtn.addEventListener("click", ()=> openEntryModal());
  const repeatBtn = document.getElementById("repeat-last");
  if (repeatBtn) repeatBtn.addEventListener("click", ()=> openEntryModal(null, getLastEntry()));
  const dayPrevBtn = document.getElementById("day-prev");
  const dayNextBtn = document.getElementById("day-next");
  if (dayPrevBtn) dayPrevBtn.addEventListener("click", ()=> goDayOrWeek(-1));
  if (dayNextBtn) dayNextBtn.addEventListener("click", ()=> goDayOrWeek(1));
  const entriesPanel = document.getElementById("entries-panel");
  if (entriesPanel){
    let touchStartX = 0, touchStartY = 0, touching = false;
    entriesPanel.addEventListener("touchstart", (e)=>{
      if (e.touches.length !== 1) return;
      touching = true;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, {passive:true});
    entriesPanel.addEventListener("touchend", (e)=>{
      if (!touching) return;
      touching = false;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
        goDayOrWeek(dx < 0 ? 1 : -1);
      }
    }, {passive:true});
  }
  document.querySelectorAll('[data-chip="trackermode"]').forEach(c=> c.addEventListener("click", ()=>{
    state.trackerMode = c.dataset.val; renderHome();
  }));
  document.querySelectorAll("[data-entry-edit]").forEach(card=> card.addEventListener("click", (e)=>{
    if (e.target.closest("[data-del]")) return;
    openEntryModal(card.dataset.entryEdit);
  }));
  document.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click", (e)=>{
    e.stopPropagation();
    state.diary = state.diary.filter(e=> e.id!==b.dataset.del);
    persistDiary();
    renderHome();
  }));
 
  const stripEl = document.getElementById("date-scroll");
  if (stripEl){
    if (state.trackerMode==="day"){
      stripEl.querySelectorAll(".date-pill").forEach(p=> p.addEventListener("click", ()=>{
        state.selectedDate = p.dataset.date; renderHome();
      }));
    } else {
      stripEl.querySelectorAll(".date-pill").forEach(p=> p.addEventListener("click", ()=>{
        state.selectedWeek = p.dataset.week; renderHome();
      }));
    }
    if (dateScrollPos !== null){
      stripEl.scrollLeft = dateScrollPos;
    } else {
      const sel = stripEl.querySelector(".date-pill.selected") || stripEl.lastElementChild;
      if (sel) sel.scrollIntoView({inline:"end", block:"nearest"});
    }
  }
}
function statTile(val,lbl){ return '<div class="stat-tile"><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div></div>'; }
function statSeg(iconName, colorVar, val, lbl){
  return '<div class="stat-seg"><span class="ic" style="color:'+colorVar+';">'+svg(iconName)+'</span><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div></div>';
}
function computeStreak(){
  const dateSet = new Set(state.diary.map(e=>e.date));
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  if (!dateSet.has(todayISO())) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while (dateSet.has(cursor.toISOString().slice(0,10))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function todayGlanceHtml(){
  const todayEntries = state.diary.filter(e=>e.date===todayISO());
  const flareCount = todayEntries.filter(e=> Math.max(0, ...Object.values(e.symptoms||{})) >= 2).length;
  const streak = computeStreak();
  let html = '<div class="today-glance">';
  html += '<span>'+(todayEntries.length ? t("glance_logged_tpl").replace("{n}", todayEntries.length) : t("glance_empty_today"))+'</span>';
  if (flareCount){
    html += '<span class="tg-sep">·</span><span class="tg-flare">'+t("flare_tpl").replace("{n}", flareCount)+'</span>';
  }
  if (streak >= 2){
    html += '<span class="tg-sep">·</span><span class="tg-streak">🔥 '+t("glance_streak_tpl").replace("{n}", streak)+'</span>';
  }
  html += '</div>';
  return html;
}
function weekShapeStripHtml(startISO){
  const locale = state.lang==="ar" ? "ar" : "en";
  let html = '<div class="week-shape">';
  for (let i=0;i<7;i++){
    const d = new Date(startISO+"T00:00:00"); d.setDate(d.getDate()+i);
    const iso = d.toISOString().slice(0,10);
    const info = dayInfo(iso);
    const cls = info.count===0 ? "" : (info.flare ? "flare" : "ok");
    html += '<div class="week-shape-seg '+cls+'"><span class="wd">'+esc(d.toLocaleDateString(locale,{weekday:"narrow"}))+'</span><span class="bar"></span></div>';
  }
  html += '</div>';
  return html;
}

        html += '<div class="fm-tile-grid">'+items.map(f=> guideTile(f)).join("")+'</div>';

  document.querySelectorAll('[data-chip="cat"]').forEach(c=> c.addEventListener("click", ()=>{ state.guideCat = c.dataset.val; renderGuide(); }));
  document.querySelectorAll('[data-chip="guideview"]').forEach(c=> c.addEventListener("click", ()=>{ state.guideView = c.dataset.val; renderGuide(); }));
}
function guideTile(f){
  return '<div class="fm-tile lvl-'+f.level+'">'
    + '<span class="fm-tile-ic">'+ficon(f)+'</span>'
    + '<span class="fm-tile-name">'+esc(fname(f))+'</span>'
    + '<span class="fm-tile-lvl"><span class="fm-tile-dot"></span>'+esc(levelShort(f.level))+'</span>'
    + '</div>';
}
function filterFoods(query, levelFilter, catFilter){
  const q = (query||"").trim().toLowerCase();
  return FOODS.filter(f=>{
    if (levelFilter && levelFilter!=="all" && f.level!==levelFilter) return false;
    if (catFilter && catFilter!=="all" && f.cat!==catFilter) return false;
    if (q && !fname(f).toLowerCase().includes(q) && !f.name.toLowerCase().includes(q)) return false;
    return true;
  }).slice().sort((a,b)=> a.cat===b.cat ? fname(a).localeCompare(fname(b), state.lang) : Object.keys(CATS).indexOf(a.cat)-Object.keys(CATS).indexOf(b.cat));
}
function chip(val, active, label, group){
  return '<button class="chip'+(active?' active':'')+'" data-chip="'+group+'" data-val="'+val+'">'+esc(label)+'</button>';
}
function badge(level){
  const L = LVL[level];
  return '<span class="badge '+L.cls+'"><span class="dot"></span>'+esc(levelLabel(level))+'</span>';
}
function emptyState(icon,title,sub){
  return '<div class="empty-state">'+svg(icon)+'<div style="font-weight:700;color:var(--text);font-size:14px;">'+esc(title)+'</div><p>'+esc(sub)+'</p></div>';
}

   VIEW: TRIGGERS
--------------------------------------------------------------- */
const SEV_ORDER = ["Mild","Moderate","Severe"];
function sevRank(s){ return SEV_ORDER.indexOf(s); }
function sevColor(s){ return s==="Mild" ? "var(--good)" : s==="Severe" ? "var(--critical)" : "var(--warning)"; }
function sevLabel(s){ return s==="Mild"?t("sev_mild"): s==="Severe"?t("sev_severe"):t("sev_moderate"); }
function triggerName(tr){ return state.lang==="ar" && tr.name_ar ? tr.name_ar : tr.name; }
function triggerNote(tr){ return state.lang==="ar" && tr.note_ar ? tr.note_ar : (tr.notes||tr.note||""); }
 
function triggerStats(tr){
  const nameLower = tr.name.toLowerCase();
  const matches = state.diary.filter(e=> (e.foods||[]).some(f=> f.trim().toLowerCase()===nameLower));
  const flareCount = matches.filter(e=> Math.max(0, ...Object.values(e.symptoms||{})) >= 2).length;
  const lastDate = matches.length ? matches.map(e=>e.date).sort().slice(-1)[0] : null;
  return {count: matches.length, flareCount, lastDate};
}
function triggerStatsLabel(tr){
  const s = triggerStats(tr);
  if (!s.count) return "";
  return t("logged_tpl").replace("{n}", s.count) + (s.flareCount ? " · " + t("flare_tpl").replace("{n}", s.flareCount) : "");
}
function removeTriggerById(id){
  const idx = state.triggers.findIndex(tr=> tr.id===id);
  if (idx<0) return;
  const removed = state.triggers[idx];
  state.triggers.splice(idx,1);
  persistTriggers();
  renderView();
  toast(t("toast_removed"), ()=>{
    state.triggers.splice(Math.min(idx, state.triggers.length), 0, removed);
    persistTriggers();
    renderView();
  });
}
 
function suggestedTriggers(){
  const existing = new Set(state.triggers.map(tr=>tr.name.toLowerCase()));
  const freq = {};
  state.diary.forEach(e=>{
    (e.foods||[]).forEach(f=>{
      const name = f.trim();
      if (!name || existing.has(name.toLowerCase())) return;
      const k = name.toLowerCase();
      const ts = new Date(e.date).getTime() || 0;
      if (!freq[k]) freq[k] = {name, count:0, last:0};
      freq[k].count++;
      if (ts > freq[k].last) freq[k].last = ts;
    });
  });
  return Object.values(freq).sort((a,b)=> b.count-a.count || b.last-a.last).slice(0,8);
}

  const existingNames = new Set(state.triggers.map(tr=>tr.name.toLowerCase()));

  }
 
  html += '<div class="card"><h2>'+t("quick_add_common")+'</h2><div class="chip-row">';
  QUICK_TRIGGERS.forEach(qt=>{

      + (added?'✓ ':'') + qt.icon + ' ' + esc(state.lang==="ar"?qt.name_ar:qt.name) + '</button>';
  });
  html += '</div>';
  html += '<div class="cat-heading" style="margin-top:16px;"><span>'+t("nonfood_heading")+'</span></div><div class="chip-row">';

  });
  html += '</div>';
  const suggested = suggestedTriggers();
  if (suggested.length){
    html += '<div class="cat-heading" style="margin-top:16px;"><span>'+t("suggested_heading")+'</span></div><div class="chip-row">';
    suggested.forEach(s=>{
      const match = FOODS.find(f=> f.name.toLowerCase()===s.name.toLowerCase());

      html += '<button class="chip" data-suggest="'+esc(s.name)+'">'+ic+' '+esc(s.name)+'</button>';
    });

  }
  html += '</div>';
 
  const tilesMode = state.fmView !== "list";

      fmBody += tilesMode

        : items.map(f=> fmRow(f, existingNames)).join("");
    });
  } else {
    Object.keys(CATS).forEach(catKey=>{
      const items = FOODS.filter(f=>f.cat===catKey);
      if (!items.length) return;
      anyFm = true;
      const open = !!state.fmOpenCats[catKey];
      fmBody += '<div class="fm-cat">'
        + '<button class="fm-cat-head" data-cat-toggle="'+catKey+'">'
          + '<span class="fm-cat-left"><span class="fm-cat-icon">'+catIcon(catKey)+'</span>'+esc(catLabel(catKey))+'</span>'
          + '<span class="fm-cat-right"><span class="fm-cat-count">'+items.length+'</span>'+svg("chevron","chevron"+(open?" open":""))+'</span>'
        + '</button>';
      if (open){
        fmBody += '<div class="fm-cat-body">'
          + (tilesMode
            ? '<div class="fm-tile-grid">'+items.map(f=> fmTile(f, existingNames)).join("")+'</div>'
            : items.map(f=> fmRow(f, existingNames)).join(""))
          + '</div>';
      }
      fmBody += '</div>';
    });
  }
  if (!anyFm) fmBody = emptyState("search", t("guide_empty_title"), t("guide_empty_sub"));
  html += '<div class="card"><h2>'+t("fodmap_list_heading")+'</h2>'
    + '<input type="search" id="fm-inline-search" placeholder="'+esc(t("search_placeholder"))+'" value="'+esc(state.fmSearch)+'" style="margin-bottom:8px;">'
    + '<div class="chip-row" style="margin-bottom:6px;">'
      + chip("tiles", tilesMode, t("view_tiles"), "fmview")
      + chip("list", !tilesMode, t("view_list"), "fmview")
    + '</div>'
    + '<div class="fodmap-list-inline" id="fm-inline-list" style="max-height:none;overflow:visible;">'+fmBody+'</div>'
    + '</div>';
 
  const customOpen = state.customTriggerOpen;
  html += '<div class="card">'
    + '<button class="fm-cat-head" data-custom-toggle="1">'
      + '<span class="fm-cat-left">'+t("custom_heading")+'</span>'
      + '<span class="fm-cat-right">'+svg("chevron","chevron"+(customOpen?" open":""))+'</span>'
    + '</button>';
  if (customOpen){
    html += '<div class="fm-cat-body">'
      + '<label class="field-label">'+t("field_food")+'</label>'
      + '<input type="text" id="trig-name" placeholder="'+esc(t("food_placeholder"))+'">'
      + '<label class="field-label">'+t("field_severity")+'</label>'
      + '<div class="sev-select" id="trig-sev">'
        + SEV_ORDER.map(s=> '<div class="sev-opt" data-sev="'+s+'">'+sevLabel(s)+'</div>').join("")
      + '</div>'
      + '<label class="field-label">'+t("field_notes")+'</label>'
      + '<textarea id="trig-notes" rows="2" placeholder="'+esc(t("notes_placeholder"))+'"></textarea>'
      + '<button class="btn block" id="trig-add" style="margin-top:14px;">'+t("btn_add_trigger")+'</button>'
      + '</div>';
  }
  html += '</div>';
 
  mountView(html);
 
  document.querySelector('[data-custom-toggle]').addEventListener("click", ()=>{
    state.customTriggerOpen = !state.customTriggerOpen;
    renderTriggers();
    if (state.customTriggerOpen){
      const nameInp = document.getElementById("trig-name");
      if (nameInp) nameInp.focus();
    }

  let chosenSev = "Moderate";
  const sevBox = document.getElementById("trig-sev");
  if (sevBox){
    const paintSev = ()=> sevBox.querySelectorAll(".sev-opt").forEach(o=> o.classList.toggle("on", o.dataset.sev===chosenSev));
    paintSev();
    sevBox.querySelectorAll(".sev-opt").forEach(o=> o.addEventListener("click", ()=>{ chosenSev = o.dataset.sev; paintSev(); }));
  }
 
  const addBtn = document.getElementById("trig-add");
  if (addBtn) addBtn.addEventListener("click", ()=>{
    const nameInp = document.getElementById("trig-name");
    const name = nameInp.value.trim();
    if (!name){ nameInp.focus(); return; }
    if (existingNames.has(name.toLowerCase())){ toast(t("toast_dup")); return; }
    state.triggers.push({id:uid(), name, icon:"🍽️", severity:chosenSev, notes:document.getElementById("trig-notes").value.trim(), added:Date.now()});
    persistTriggers();
    state.customTriggerOpen = false;
    toast(t("toast_added"));
    renderTriggers();
  });
 
  document.querySelectorAll("[data-quick]").forEach(btn=> btn.addEventListener("click", ()=>{
    const name = btn.dataset.quick;
    const kind = btn.dataset.kind === "nonfood" ? "nonfood" : "food";
    const source = kind === "nonfood" ? NONFOOD_TRIGGERS : QUICK_TRIGGERS;
    const existing = state.triggers.find(tr=> tr.name.toLowerCase()===name.toLowerCase());
    if (existing){
      removeTriggerById(existing.id);
    } else {
      const qt = source.find(q=>q.name===name);
      state.triggers.push({id:uid(), name, name_ar:qt.name_ar, icon:qt.icon, kind, severity:"Moderate", notes:qt.note||"", note_ar:qt.note_ar||"", added:Date.now()});
      persistTriggers();
      toast(t("toast_added"));
      renderTriggers();
    }
  }));
 
  const fmSearchInp = document.getElementById("fm-inline-search");
  fmSearchInp.addEventListener("input", (e)=>{
    state.fmSearch = e.target.value;
    renderTriggers();
    const i = document.getElementById("fm-inline-search");
    i.focus(); i.setSelectionRange(i.value.length, i.value.length);
  });
  document.querySelectorAll("#fm-inline-list [data-add]").forEach(btn=> btn.addEventListener("click", ()=>{
    const foodName = btn.dataset.add;
    const existing = state.triggers.find(tr=> tr.name.toLowerCase()===foodName.toLowerCase());
    if (existing){
      removeTriggerById(existing.id);
    } else {
      const food = FOODS.find(f=>f.name===foodName);
      state.triggers.push({id:uid(), name:food.name, name_ar:food.name_ar, icon:ficon(food), kind:"food", severity:"Moderate", notes:"", note_ar:"", added:Date.now()});
      persistTriggers();
      toast(t("toast_added"));
      renderTriggers();
    }
  }));
  document.querySelectorAll("[data-cat-toggle]").forEach(btn=> btn.addEventListener("click", ()=>{
    const k = btn.dataset.catToggle;
    state.fmOpenCats[k] = !state.fmOpenCats[k];
    renderTriggers();
  }));
 
  document.querySelectorAll("[data-suggest]").forEach(btn=> btn.addEventListener("click", ()=>{
    const name = btn.dataset.suggest;

    state.triggers.push({id:uid(), name, name_ar: match?match.name_ar:"", icon: match?ficon(match):"🍽️", kind:"food", severity:"Moderate", notes:"", note_ar:"", added:Date.now()});
    persistTriggers();
    toast(t("toast_added"));
    renderTriggers();

  document.querySelectorAll('[data-chip="fmview"]').forEach(c=> c.addEventListener("click", ()=>{

  const goTrackedBtn = document.getElementById("go-tracked");

function openEditTriggerModal(id){

    document.getElementById("edit-backdrop").addEventListener("click", (e)=>{ if (e.target.id==="edit-backdrop") closeModal(); });
    document.querySelectorAll("#edit-sev .sev-opt").forEach(o=> o.addEventListener("click", ()=>{ chosenSev = o.dataset.sev; draw(); }));
    document.getElementById("edit-save").addEventListener("click", ()=>{
      tr.severity = chosenSev;

function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

   VIEW: TRACKED
--------------------------------------------------------------- */
function formatAddedDate(ts){
  if (!ts) return "";
  const d = new Date(ts); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - d)/86400000);
  if (diff===0) return t("today");
  if (diff===1) return t("yesterday");
  const locale = state.lang==="ar" ? "ar" : undefined;
  return d.toLocaleDateString(locale,{month:"short", day:"numeric"});
}
function trackedStats(){
  const total = state.triggers.length;
  const severe = state.triggers.filter(tr=> tr.severity==="Severe").length;
  const flareTotal = state.triggers.reduce((sum,tr)=> sum + triggerStats(tr).flareCount, 0);
  return {total, severe, flareTotal};
}
function trackedTileHtml(tr){
  const stats = triggerStats(tr);
  const statLbl = stats.count
    ? t("logged_tpl").replace("{n}", stats.count) + (stats.flareCount ? " · " + t("flare_tpl").replace("{n}", stats.flareCount) : "")
    : "";
  return '<div class="trigger-tile" data-edit="'+tr.id+'">'
    + '<button class="tile-rm" data-rm="'+tr.id+'" aria-label="Remove">×</button>'
    + (tr.auto ? '<span class="auto-tag tile-auto">'+esc(t("auto_tag"))+'</span>' : '')
    + '<span class="tile-date">'+esc(formatAddedDate(tr.added))+'</span>'
    + '<span class="ic">'+(tr.icon||'🍽️')+'</span>'
    + '<span class="name">'+esc(triggerName(tr))+'</span>'
    + '<span class="sev-lbl" style="color:'+sevColor(tr.severity)+'"><span class="sev-dot" style="background:'+sevColor(tr.severity)+'"></span>'+esc(sevLabel(tr.severity))+'</span>'
    + (statLbl ? '<span class="stat-lbl">'+esc(statLbl)+'</span>' : '')
    + '</div>';
}
function renderTracked(){
  let html = "";
  if (!state.triggers.length){
    html += emptyState("target", t("tracked_empty_title"), t("tracked_empty_sub"));
    mountView(html);
    return;
  }
 
  const stats = trackedStats();
  html += '<div class="stat-strip">'
    + statSeg("target", "var(--brand)", stats.total, t("stat_triggers"))
    + statSeg("warn", "var(--critical)", stats.severe, t("stat_severe"))
    + statSeg("insights", "var(--warning)", stats.flareTotal, t("stat_flareups"))
    + '</div>';
 
  html += '<input type="search" id="tracked-search" placeholder="'+esc(t("search_tracked_placeholder"))+'" value="'+esc(state.trackedSearch)+'" style="margin-bottom:8px;">';
  html += '<div class="chip-row" style="margin-bottom:12px;">'
    + chip("all", state.trackedFilter==="all", t("filter_all_sev"), "trackedsev")
    + chip("Mild", state.trackedFilter==="Mild", t("sev_mild"), "trackedsev")
    + chip("Moderate", state.trackedFilter==="Moderate", t("sev_moderate"), "trackedsev")
    + chip("Severe", state.trackedFilter==="Severe", t("sev_severe"), "trackedsev")
    + '</div>';
 
  const q = state.trackedSearch.trim().toLowerCase();
  const filtered = state.triggers.filter(tr=>{
    if (state.trackedFilter!=="all" && tr.severity!==state.trackedFilter) return false;
    if (q && !triggerName(tr).toLowerCase().includes(q) && !tr.name.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> (b.added||0)-(a.added||0));
 
  if (!filtered.length){
    html += emptyState("search", t("guide_empty_title"), t("guide_empty_sub"));

    html += '<div class="trigger-tile-grid">' + filtered.map(trackedTileHtml).join("") + '</div>';

  mountView(html);
 
  document.getElementById("tracked-search").addEventListener("input", (e)=>{

    i.focus(); i.setSelectionRange(i.value.length, i.value.length);
  });
  document.querySelectorAll('[data-chip="trackedsev"]').forEach(c=> c.addEventListener("click", ()=>{
    state.trackedFilter = c.dataset.val; renderTracked();
  }));
  document.querySelectorAll("[data-edit]").forEach(card=> card.addEventListener("click", (e)=>{
    if (e.target.closest("[data-rm]")) return;
    openEditTriggerModal(card.dataset.edit);
  }));
  document.querySelectorAll("[data-rm]").forEach(btn=> btn.addEventListener("click", (e)=>{
    e.stopPropagation();

}
 
/* ---------------------------------------------------------------
   VIEW: DIARY (with horizontal date scroller)
--------------------------------------------------------------- */
function dayInfo(dateISO){
  const entries = state.diary.filter(e=>e.date===dateISO);
  const flare = entries.some(e=> Math.max(0, ...Object.values(e.symptoms||{})) >= 2);
  return {count:entries.length, flare};
}
function buildDateList(days){
  const arr = [];
  const base = new Date(); base.setHours(0,0,0,0);
  for (let i=days-1;i>=0;i--){
    const d = new Date(base); d.setDate(base.getDate()-i);
    arr.push(d.toISOString().slice(0,10));
  }
  return arr;
}
function startOfWeek(d){
  const nd = new Date(d); nd.setHours(0,0,0,0);
  const day = nd.getDay();
  const diff = (day===0 ? -6 : 1-day);
  nd.setDate(nd.getDate()+diff);
  return nd;
}
function buildWeekList(n){
  const arr = [];
  const base = startOfWeek(new Date());
  for (let i=n-1;i>=0;i--){
    const d = new Date(base); d.setDate(base.getDate()-7*i);
    arr.push(d.toISOString().slice(0,10));
  }
  return arr;
}
function weekEndISO(startISO){
  const d = new Date(startISO+"T00:00:00"); d.setDate(d.getDate()+6);
  return d.toISOString().slice(0,10);
}
function shiftDate(iso, days){
  const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function shiftWeekISO(iso, weeks){
  const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+7*weeks);
  return d.toISOString().slice(0,10);
}
function goDayOrWeek(dir){
  if (state.trackerMode === "day"){
    const next = shiftDate(state.selectedDate, dir);
    if (next > todayISO()) return;
    state.selectedDate = next;
  } else {
    const next = shiftWeekISO(state.selectedWeek, dir);
    if (next > buildWeekList(1)[0]) return;
    state.selectedWeek = next;
  }
  renderHome(true);
}
function getLastEntry(){
  if (!state.diary.length) return null;
  return [...state.diary].sort((a,b)=> (b.date+(b.time||"")).localeCompare(a.date+(a.time||"")))[0];
}
function weekInfo(startISO){
  const end = weekEndISO(startISO);
  const entries = state.diary.filter(e=> e.date>=startISO && e.date<=end);
  const flare = entries.some(e=> Math.max(0, ...Object.values(e.symptoms||{})) >= 2);
  return {count:entries.length, flare};
}
function weekLabel(startISO){
  const s = new Date(startISO+"T00:00:00"), end = new Date(weekEndISO(startISO)+"T00:00:00");
  const locale = state.lang==="ar" ? "ar" : undefined;
  const sMonth = s.toLocaleDateString(locale,{month:"short"}), eMonth = end.toLocaleDateString(locale,{month:"short"});
  return sMonth===eMonth ? (sMonth+" "+s.getDate()+"–"+end.getDate()) : (sMonth+" "+s.getDate()+" – "+eMonth+" "+end.getDate());
}
function renderDateStrip(){
  if (state.trackerMode === "week") return renderWeekStrip();
  const dates = buildDateList(30);
  const locale = state.lang==="ar" ? "ar" : "en";
  let html = '<div class="date-scroll-wrap"><div class="date-scroll" id="date-scroll">';
  dates.forEach(dISO=>{
    const d = new Date(dISO+"T00:00:00");
    const info = dayInfo(dISO);
    const dotCls = info.count===0 ? "none" : (info.flare ? "flare" : "");
    const selected = dISO===state.selectedDate;
    const isToday = dISO===todayISO();
    html += '<button class="date-pill'+(selected?' selected':'')+(isToday?' is-today':'')+'" data-date="'+dISO+'">'
      + '<span class="dow">'+(isToday ? esc(t("today")) : esc(d.toLocaleDateString(locale,{weekday:"short"})))+'</span>'
      + '<span class="dom">'+d.getDate()+'</span>'
      + '<span class="dot '+dotCls+'"></span>'
      + '</button>';
  });
  html += '</div></div>';
  return html;
}
function renderWeekStrip(){
  const weeks = buildWeekList(12);
  let html = '<div class="date-scroll-wrap"><div class="date-scroll" id="date-scroll">';
  weeks.forEach(wISO=>{
    const info = weekInfo(wISO);
    const dotCls = info.count===0 ? "none" : (info.flare ? "flare" : "");
    const selected = wISO===state.selectedWeek;
    html += '<button class="date-pill week-pill'+(selected?' selected':'')+'" data-week="'+wISO+'">'
      + '<span class="dow">'+esc(weekLabel(wISO))+'</span>'
      + '<span class="dot '+dotCls+'"></span>'
      + '</button>';
  });
  html += '</div></div>';
  return html;
}
function formatDate(iso){
  const d = new Date(iso+"T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - d)/86400000);
  if (diff===0) return t("today");
  if (diff===1) return t("yesterday");
  const locale = state.lang==="ar" ? "ar" : undefined;
  return d.toLocaleDateString(locale,{weekday:"short", month:"short", day:"numeric"});
}
function entryCardHtml(e){
  let html = '<div class="entry-card" data-entry-edit="'+e.id+'"><div class="top"><div>'
    + '<div class="time">'+esc(e.time||'')+(e.meal?' · '+esc(mealLabel(e.meal)):'')+'</div>'
    + '<div class="foods">'+esc((e.foods||[]).join(", ")||"—")+'</div>'
    + (e.amount ? '<div class="serv" style="margin-bottom:2px;">'+esc(e.amount)+'</div>' : '')
    + '</div><button class="del" data-del="'+e.id+'">'+t("btn_delete")+'</button></div>';
  const symEntries = Object.entries(e.symptoms||{}).filter(([,v])=>v>0);
  if (symEntries.length){
    html += '<div class="sym-chips">'+symEntries.map(([k,v])=>
      '<span class="sym-chip'+(v>=2?' hi':'')+'">'+esc(symLabel(k))+' '+"●".repeat(v)+'</span>').join("")+'</div>';
  } else {
    html += '<div class="sym-chips"><span class="sym-chip">'+t("no_symptoms")+'</span></div>';
  }
  if (e.notes) html += '<div class="notes">'+esc(e.notes)+'</div>';
  html += '</div>';
  return html;
}
function mealFromHour(h){
  if (h<11) return "Breakfast";
  if (h<15) return "Lunch";
  if (h<21) return "Dinner";
  return "Snack";
}
function openEntryModal(editId, repeatFrom){
  const editingEntry = editId ? state.diary.find(e=>e.id===editId) : null;
  const now = new Date();
  const dateVal = editingEntry ? editingEntry.date : (state.trackerMode==="day" ? state.selectedDate : todayISO());
  const timeVal = editingEntry ? (editingEntry.time || now.toTimeString().slice(0,5)) : now.toTimeString().slice(0,5);
  const defaultMeal = editingEntry ? (editingEntry.meal || mealFromHour(now.getHours())) : mealFromHour(now.getHours());
  const symState = {}; SYMPTOMS.forEach(s=> symState[s]= editingEntry ? (editingEntry.symptoms && editingEntry.symptoms[s] || 0) : 0);
 
  const knownNames = [...new Set([...FOODS.map(f=>fname(f)), ...state.triggers.map(tr=>triggerName(tr))])];
 
  const root = document.getElementById("modal-root");
  root.innerHTML = '<div class="modal-backdrop" id="modal-backdrop">'
    + '<div class="modal-sheet">'
    + '<div class="modal-head"><h2>'+(editingEntry ? t("edit_entry_title") : t("btn_log_entry"))+'</h2><button id="modal-close">×</button></div>'
    + '<label class="field-label">'+t("field_foods")+'</label>'
    + '<div class="food-chip-input" id="e-foods-chips"></div>'
    + '<datalist id="known-foods">'+knownNames.map(n=>'<option value="'+esc(n)+'">').join("")+'</datalist>'
    + '<label class="field-label">'+t("field_amount")+'</label>'
    + '<input type="text" id="e-amount" placeholder="'+esc(t("amount_placeholder"))+'" value="'+esc(editingEntry ? (editingEntry.amount||"") : (repeatFrom ? (repeatFrom.amount||"") : ""))+'">'
    + '<label class="field-label" style="margin-top:16px;">'+t("symptoms_heading")+'</label>'
    + SYMPTOMS.map(s=> symptomRow(s)).join("")
    + '<label style="display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:13px;color:var(--text-secondary);cursor:pointer;">'
      + '<input type="checkbox" id="e-advanced-toggle" style="width:auto;"'+(editingEntry?' checked':'')+'>' + esc(t("more_options"))
    + '</label>'
    + '<div id="e-advanced" style="display:'+(editingEntry?'block':'none')+';">'
      + '<label class="field-label">'+t("field_date")+'</label><input type="date" id="e-date" value="'+dateVal+'">'
      + '<label class="field-label">'+t("field_time")+'</label><input type="time" id="e-time" value="'+timeVal+'">'
      + '<label class="field-label">'+t("field_meal")+'</label><select id="e-meal">'
        + MEALS.map(m=>'<option value="'+m+'"'+(m===defaultMeal?' selected':'')+'>'+esc(mealLabel(m))+'</option>').join("")
      + '</select>'
      + '<label class="field-label">'+t("field_notes")+'</label>'
      + '<textarea id="e-notes" rows="2" placeholder="'+esc(t("notes_placeholder"))+'">'+esc(editingEntry ? (editingEntry.notes||"") : "")+'</textarea>'
    + '</div>'
    + '<button class="btn block" id="e-save" style="margin-top:16px;">'+t("btn_save_entry")+'</button>'
    + '</div></div>';
 
  document.getElementById("e-advanced-toggle").addEventListener("change", (e)=>{
    document.getElementById("e-advanced").style.display = e.target.checked ? "block" : "none";
  });
 
  let entryFoods = editingEntry ? [...(editingEntry.foods||[])] : (repeatFrom ? [...(repeatFrom.foods||[])] : []);
  function renderFoodChips(focusInput){
    const wrap = document.getElementById("e-foods-chips");
    wrap.innerHTML = entryFoods.map((f,i)=> '<span class="food-chip">'+esc(f)+'<button type="button" data-rmfood="'+i+'" aria-label="Remove">×</button></span>').join("")
      + '<input type="text" id="e-foods-input" list="known-foods" placeholder="'+(entryFoods.length ? "" : esc(t("foods_placeholder")))+'">';
    const inp = document.getElementById("e-foods-input");
    inp.addEventListener("keydown", (e)=>{
      if (e.key==="Enter" || e.key===","){ e.preventDefault(); commitFood(inp.value); }
      else if (e.key==="Backspace" && !inp.value && entryFoods.length){ entryFoods.pop(); renderFoodChips(true); }
    });
    inp.addEventListener("blur", ()=>{ if (inp.value.trim()) commitFood(inp.value); });
    wrap.querySelectorAll("[data-rmfood]").forEach(b=> b.addEventListener("click", ()=>{
      entryFoods.splice(Number(b.dataset.rmfood),1); renderFoodChips();
    }));
    if (focusInput) inp.focus();
  }
  function commitFood(val){
    const name = val.trim().replace(/,$/,"").trim();
    if (name) entryFoods.push(name);
    const inp = document.getElementById("e-foods-input");
    if (inp) inp.value = "";
    renderFoodChips(true);
  }
  renderFoodChips();
 
  function symptomRow(s){
    return '<div class="symptom-row"><span class="lbl">'+esc(symLabel(s))+'</span><div class="sev-scale" data-symptom="'+s+'">'
      + [0,1,2,3].map(n=> '<button class="sev-btn on'+n+'" data-n="'+n+'">'+n+'</button>').join("")
      + '</div></div>';
  }
  function paintSymptoms(){
    root.querySelectorAll(".sev-scale").forEach(row=>{
      const s = row.dataset.symptom;
      row.querySelectorAll(".sev-btn").forEach(b=> b.classList.toggle("on", Number(b.dataset.n)===symState[s]));
    });
  }
  paintSymptoms();
  root.querySelectorAll(".sev-scale").forEach(row=>{
    row.querySelectorAll(".sev-btn").forEach(b=> b.addEventListener("click", ()=>{
      symState[row.dataset.symptom] = Number(b.dataset.n);
      paintSymptoms();
    }));
  });
 
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-backdrop").addEventListener("click", (e)=>{ if (e.target.id==="modal-backdrop") closeModal(); });
 
  document.getElementById("e-save").addEventListener("click", ()=>{
    const pendingInp = document.getElementById("e-foods-input");
    if (pendingInp && pendingInp.value.trim()){
      entryFoods.push(pendingInp.value.trim().replace(/,$/,"").trim());
      pendingInp.value = "";
    }
    const foods = entryFoods.slice();
    const entry = {
      id: editingEntry ? editingEntry.id : uid(),
      date: document.getElementById("e-date").value || dateVal,
      time: document.getElementById("e-time").value || timeVal,
      meal: document.getElementById("e-meal").value,
      foods, amount: document.getElementById("e-amount").value.trim(),
      symptoms: {...symState},
      notes: document.getElementById("e-notes").value.trim()
    };
    if (editingEntry){
      const idx = state.diary.findIndex(e=> e.id===editingEntry.id);
      if (idx > -1) state.diary[idx] = entry;
    } else {
      state.diary.push(entry);
    }
    persistDiary();
    state.selectedDate = entry.date;
    state.trackerMode = "day";
 
    // Auto-add foods to Triggers when this entry carries a significant symptom (level 2+)
    const maxSym = Math.max(0, ...Object.values(entry.symptoms));
    const addedNames = [];
    if (maxSym >= 2 && foods.length){
      const existing = new Set(state.triggers.map(tr=>tr.name.toLowerCase()));
      foods.forEach(fn=>{
        if (existing.has(fn.toLowerCase())) return;
        const match = FOODS.find(f=> f.name.toLowerCase()===fn.toLowerCase());
        state.triggers.push({
          id:uid(), name:fn, name_ar: match ? match.name_ar : "",
          icon: match ? ficon(match) : "🍽️",
          kind:"food", auto:true,
          severity: maxSym>=3 ? "Severe" : "Moderate",
          notes: I18N.en.auto_added_note, note_ar: I18N.ar.auto_added_note, added:Date.now()
        });
        existing.add(fn.toLowerCase());
        addedNames.push(fn);
      });
      if (addedNames.length) persistTriggers();
    }
 
    closeModal();
    toast(addedNames.length ? t("toast_autoadded").replace("{list}", addedNames.join(", ")) : (editingEntry ? t("toast_updated") : t("toast_saved")));
    renderHome();
  });
}
 
/* ---------------------------------------------------------------
   VIEW: INSIGHTS
--------------------------------------------------------------- */
function renderInsights(){
  let html = "";
  if (state.diary.length < 3){
    html += emptyState("insights", t("insights_scarce_title"), t("insights_scarce_sub"));
    mountView(html);
    return;
  }
 
  const counts = {};
  state.diary.forEach(e=>{
    const flare = Math.max(0, ...Object.values(e.symptoms||{})) >= 2;
    (e.foods||[]).forEach(f=>{
      const key = f.trim();
      if (!key) return;
      counts[key] = counts[key] || {total:0, flare:0};
      counts[key].total += 1;
      if (flare) counts[key].flare += 1;
    });
  });
 
  const rows = Object.entries(counts).map(([name,c])=> ({name, ...c}))
    .sort((a,b)=> b.flare - a.flare || b.total - a.total).slice(0, 8);
 
  const totalLogged = state.diary.length;
  const symptomLogs = state.diary.filter(e=> Math.max(0, ...Object.values(e.symptoms||{})) >= 2).length;
 
  html += '<div class="stat-strip">'
    + statSeg("diary", "var(--brand)", totalLogged, t("stat_total"))
    + statSeg("warn", "var(--critical)", symptomLogs, t("stat_flareups"))
    + statSeg("target", "var(--brand)", state.triggers.length, t("stat_triggers"))
    + '</div>';
 
  if (!rows.some(r=>r.flare>0)){
    html += '<div class="card" style="margin-top:12px;">'+emptyState("check", t("insights_noflare_title"), t("insights_noflare_sub"))+'</div>';
    mountView(html);
    return;
  }
 
  const max = Math.max(...rows.map(r=>r.flare), 1);
  html += '<div class="card" style="margin-top:12px;">'
    + '<h2>'+t("chart_title")+'</h2>'
    + '<p class="small muted" style="margin:-4px 0 14px;">'+t("chart_sub")+'</p>'
    + '<div class="chart-wrap" id="chart-wrap" style="padding-inline-end:30px;">'
    + rows.map(r=>{
        const pct = Math.round((r.flare/max)*100);
        return '<div class="bar-row">'
          + '<div class="blabel">'+esc(r.name)+'</div>'
          + '<div class="bar-track"><div class="bar-fill" tabindex="0" style="width:0%;" data-pct="'+pct+'" '
            + 'data-name="'+esc(r.name)+'" data-flare="'+r.flare+'" data-total="'+r.total+'">'
            + '<span class="tip-val">'+r.flare+'</span></div></div>'
          + '</div>';
      }).join("")
    + '</div>'
    + '<p class="small muted" style="margin-top:4px;">'+t("chart_footnote")+'</p>'
    + '</div>';
 
  mountView(html);
 
  const wrap = document.getElementById("chart-wrap");
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      wrap.querySelectorAll(".bar-fill").forEach(el=>{ el.style.width = el.dataset.pct + "%"; });
    });
  });
  let tip;
  function showTip(el){
    hideTip();
    const rect = el.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    tip = document.createElement("div");
    tip.className = "chart-tooltip";
    tip.innerHTML = '<b>'+el.dataset.flare+'</b> / '+el.dataset.total+' '+esc(t("tooltip_logs"))+' &middot; <span>'+esc(el.dataset.name)+'</span>';
    wrap.appendChild(tip);
    tip.style.left = (rect.left - wrapRect.left + rect.width/2) + "px";
    tip.style.top = (rect.top - wrapRect.top) + "px";
  }
  function hideTip(){ if (tip){ tip.remove(); tip = null; } }
  wrap.querySelectorAll(".bar-fill").forEach(el=>{
    el.addEventListener("pointerenter", ()=> showTip(el));
    el.addEventListener("focus", ()=> showTip(el));
    el.addEventListener("pointerleave", hideTip);
    el.addEventListener("blur", hideTip);
    el.addEventListener("click", ()=> showTip(el));
  });
}
